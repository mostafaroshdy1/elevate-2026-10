syntax = "proto3";

package social.comments;

message Comment {
  int32 id = 1;
  int32 post_id = 2;
  int32 author_id = 3;
  string content = 4;
  string created_at = 5;
}

message ListCommentsByPostRequest {
  int32 post_id = 1;
}
message ListCommentsByPostResponse {
  repeated Comment comments = 1;
}

message CreateCommentRequest {
  int32 post_id = 1;
  int32 author_id = 2;
  string content = 3;
}
message CreateCommentResponse {
  Comment comment = 1;
}

message DeleteCommentRequest {
  int32 id = 1;
}
message DeleteCommentResponse {
  int32 post_id = 1;
}

message ImportCommentsRequest {
  int32 post_id = 1;
  int32 author_id = 2;
  string content = 3;
}
message ImportCommentsResponse {
  int32 imported = 1;
  int32 failed = 2;
  repeated string errors = 3;
}

service CommentService {
  rpc ImportComments(stream ImportCommentsRequest) returns (ImportCommentsResponse);
  rpc ListCommentsByPost(ListCommentsByPostRequest) returns (ListCommentsByPostResponse);
  rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse);
  rpc DeleteComment(DeleteCommentRequest) returns (DeleteCommentResponse);
}
